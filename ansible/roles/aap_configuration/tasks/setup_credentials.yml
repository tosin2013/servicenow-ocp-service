---
# ansible/roles/aap_configuration/tasks/setup_credentials.yml
# Sets up credentials in AAP for OpenShift and ServiceNow integration

- name: Include OpenShift Service Account setup
  include_tasks: setup_openshift_service_account.yml

- name: Create OpenShift API Token Credential in AAP
  ansible.controller.credential:
    controller_host: "{{ controller_host }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    name: "OpenShift API Token"
    organization: "Default"
    credential_type: "OpenShift or Kubernetes API Bearer Token"
    inputs:
      host: "{{ openshift_api_url }}"
      bearer_token: "{{ bearer_token }}"
      verify_ssl: false
    state: present
  register: openshift_credential

- name: Create Vault Credential Type (if not exists)
  ansible.controller.credential_type:
    controller_host: "{{ controller_host }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    name: "Ansible Vault"
    description: "Credential type for Ansible Vault passwords"
    kind: "vault"
    inputs:
      fields:
        - id: vault_password
          type: string
          label: Vault Password
          secret: true
      required:
        - vault_password
    injectors:
      env:
        ANSIBLE_VAULT_PASSWORD: "{{ vault_password }}"
    state: present
  ignore_errors: true

- name: Create ServiceNow-OpenShift Vault Credential
  ansible.controller.credential:
    controller_host: "{{ controller_host }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    name: "ServiceNow-OpenShift Vault"
    organization: "Default"
    credential_type: "Vault"
    inputs:
      vault_password: "{{ vault_password | default(lookup('file', playbook_dir + '/../.vault_pass')) }}"
    state: present
  register: vault_credential

- name: Create ServiceNow Credential Type
  ansible.controller.credential_type:
    controller_host: "{{ controller_host }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    name: "ServiceNow"
    description: "Credential type for ServiceNow API access"
    kind: "cloud"
    inputs:
      fields:
        - id: snow_instance
          type: string
          label: ServiceNow Instance URL
        - id: snow_username
          type: string
          label: ServiceNow Username
        - id: snow_password
          type: string
          label: ServiceNow Password
          secret: true
      required:
        - snow_instance
        - snow_username
        - snow_password
    injectors:
      extra_vars:
        servicenow_instance: "{{ snow_instance }}"
        servicenow_username: "{{ snow_username }}"
        servicenow_password: "{{ snow_password }}"
    state: present
  ignore_errors: true

- name: Create ServiceNow API Credential
  ansible.controller.credential:
    controller_host: "{{ controller_host }}"
    controller_username: "{{ controller_username }}"
    controller_password: "{{ controller_password }}"
    validate_certs: "{{ controller_validate_certs | default(false) }}"
    name: "ServiceNow API"
    organization: "Default"
    credential_type: "ServiceNow"
    inputs:
      snow_instance: "{{ servicenow_instance }}"
      snow_username: "{{ servicenow_username }}"
      snow_password: "{{ servicenow_password }}"
    state: present
  when: servicenow_instance is defined
  register: servicenow_credential
  ignore_errors: true

- name: Display credential setup results
  debug:
    msg:
      - "🔐 AAP Credentials Setup Summary:"
      - "================================="
      - "OpenShift Token: {{ 'Created' if openshift_credential.changed else 'Already exists' }}"
      - "Vault Credential: {{ 'Created' if vault_credential.changed else 'Already exists' }}"
      - "ServiceNow Credential: {{ 'Created' if (servicenow_credential is defined and servicenow_credential.changed) else 'Skipped or already exists' }}"
      - ""
      - "Token Source: {{ 'Service Account (servicenow-aap-sa)' if bearer_token == service_account_token else 'Vault Token' }}"
      - "OpenShift API: {{ openshift_api_url }}"

